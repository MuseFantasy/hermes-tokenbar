name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and checks
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Release hygiene
        run: python3 scripts/check_release_hygiene.py

      - name: Static UI checks
        run: |
          python3 scripts/check_colored_menu_items.py
          python3 scripts/check_adaptive_detail_format.py
          python3 scripts/check_input_output_breakdown.py
          python3 scripts/check_status_label_format.py
          python3 scripts/check_no_floating_window.py

      - name: Core smoke tests
        run: swift run HermesTokenCoreSmokeTests

      - name: Build release product
        run: swift build -c release --product HermesTokenBar
