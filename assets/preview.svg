<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HermesTokenBar preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#202636"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>

  <text x="72" y="92" fill="#f5f7fb" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="44" font-weight="700">HermesTokenBar</text>
  <text x="72" y="132" fill="#aab3c5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="22">Native macOS menu bar token activity monitor for Hermes Agent</text>

  <rect x="72" y="176" width="1136" height="44" rx="16" fill="#eef0f6" opacity="0.95"/>
  <circle cx="62" cy="211" r="7" fill="#ff5f57"/>
  <circle cx="84" cy="211" r="7" fill="#ffbd2e"/>
  <circle cx="106" cy="211" r="7" fill="#28c840"/>
  <text x="1048" y="218" fill="#1d2430" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="19" font-weight="600">10.0M</text>
  <text x="1124" y="218" fill="#4c5567" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="17">Mon 02:06</text>

  <g filter="url(#shadow)">
    <rect x="760" y="246" width="360" height="390" rx="18" fill="#f8f9fc"/>
    <rect x="760" y="242" width="360" height="56" rx="18" fill="#ffffff"/>
    <text x="788" y="278" fill="#1f2430" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="18" font-weight="700">Hermes Token Bar</text>

    <text x="788" y="330" fill="#007aff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="17" font-weight="600">Today total: 10.0M tokens</text>
    <text x="808" y="362" fill="#34c759" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16">Input: 9.9M tokens</text>
    <text x="808" y="392" fill="#ff9500" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16">Output: 19.1K tokens</text>

    <line x1="788" y1="416" x2="1092" y2="416" stroke="#e3e7ef"/>

    <text x="788" y="452" fill="#af52de" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="17" font-weight="600">Month total: 2,109.0M tokens</text>
    <text x="808" y="482" fill="#34c759" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16">Input: 2,103.1M tokens</text>
    <text x="808" y="512" fill="#ff9500" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16">Output: 5.9M tokens</text>

    <line x1="788" y1="532" x2="1092" y2="532" stroke="#e3e7ef"/>

    <text x="788" y="568" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15">Top models this month</text>
    <text x="808" y="596" fill="#1f2430" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="14">model-a: 1,257.1M</text>
    <text x="808" y="622" fill="#1f2430" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="14">model-b: 665.5M</text>

    <line x1="788" y1="642" x2="1092" y2="642" stroke="#e3e7ef"/>
    <text x="788" y="670" fill="#8a93a5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14">Read-only · no hooks · local only</text>
  </g>

  <g>
    <rect x="72" y="292" width="560" height="250" rx="22" fill="#151b28" stroke="#2d364a"/>
    <text x="104" y="346" fill="#f5f7fb" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="22" font-weight="700">Privacy boundary</text>
    <text x="104" y="386" fill="#aab3c5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="18">✓ Reads local Hermes SQLite database in read-only mode</text>
    <text x="104" y="426" fill="#aab3c5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="18">✓ No network calls, hooks, uploads, or config writes</text>
    <text x="104" y="462" fill="#aab3c5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="18">✓ Optional custom DB path via HERMES_TOKENBAR_DB</text>
    <text x="104" y="512" fill="#7c879c" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15">Token values are activity metrics, not billing statements.</text>
  </g>
</svg>
